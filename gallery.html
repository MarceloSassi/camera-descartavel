<body class="has-nav">
  <main class="page gallery-page">
    <div class="bento gallery-bento">
      <section class="tile tile-hero">
        <p class="eyebrow">revelação</p>
        <h1 id="galleryTitle" class="names">Lorena <span class="amp">&amp;</span> Marcelo</h1>
        <p class="date">29 · 11 · 2026 · 23h</p>
      </section>

      <section id="lockedState" class="tile tile-lock">
        <p class="tile-kicker">em revelação</p>
        <h2>Tudo aparece junto às 23h.</h2>
        <div id="countdown" class="countdown">--:--:--</div>
        <p id="revealConfigMessage"></p>
      </section>
    </div>

    <section id="galleryState" hidden>
      <div class="gallery-header">
        <p id="photoCount">Carregando fotos…</p>
        <button id="refreshButton" class="btn btn-ghost btn-small" type="button">Atualizar</button>
      </div>
      <div id="galleryGrid" class="gallery-grid"></div>
      <p id="galleryMessage" class="gallery-message"></p>
    </section>
  </main>
